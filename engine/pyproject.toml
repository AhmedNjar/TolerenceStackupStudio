[project]
name = "tolerance-engine"
version = "0.1.0"
description = "Embedded calculation engine for Tolerance Stack-up Studio"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sympy>=1.12",
    "numpy>=1.26",     # Phase 2: Monte Carlo
    "scipy>=1.12",     # Phase 2: inverse tolerance optimizer
    "reportlab>=4.1",  # Phase 4: PDF report
    "openpyxl>=3.1",   # Phase 4: Excel export
    "matplotlib>=3.8", # Phase 4: histogram/Pareto chart images embedded in the PDF report
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.5",
    "pytest>=8.0",
    # Pure-Python Excel formula evaluator, used ONLY by
    # tests/test_excel_export.py to actually recalculate the exported
    # workbook and cross-check it against the engine's own WC/RSS output —
    # not a runtime dependency of the engine itself.
    "formulas>=1.3",
    # Read-only PDF inspection, used ONLY by tests/test_pdf_report.py to
    # verify the generated report's page count and text content — not a
    # runtime dependency (the pdf skill / reportlab handle PDF writing).
    "pypdf>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
